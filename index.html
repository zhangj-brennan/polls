<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data filtering test</title>

<style>
/* =========================
   Base / Typography
========================= */
@font-face {
  font-family: "Benton";
  src: url("Benton Sans/Benton Sans Book.otf");
}
@font-face {
  font-family: "BentonStrong";
  src: url("Benton Sans/Benton Sans Bold.otf");
}

:root {
  /* Fallback used when a topic is not in SUBJECT_COLORS */
  --subject-color-default: #777;
}

body {
  font-family: "Benton", -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  margin: 16px;
}

h1 {
  font-size: 24px;
  margin: 0 0 12px;
  font-family: "BentonStrong";
}

a {
  color: #007194;
  text-decoration: none;
}

/* =========================
   Topbar / Panels
========================= */
.topbar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.panel {
  font-family: "BentonStrong";
  /* border: 1px solid #ddd; */
  border-radius: 0px;
  padding: 12px;
}

.panel h2 {
  font-size: 14px;
  margin: 0 0 8px;
  color: #444;
}

.btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* =========================
   Controls
========================= */
button.filter {
  border: 1px solid #ccc;
  background: #fff;
  padding: 6px 12px;
  border-radius: 0px;
  cursor: pointer; 
  text-align:left;
  max-width:200px;
  
}

button.filter[aria-pressed="true"] {
  border-color: #000;
  background: #000;
  color: #fff;
}

button.filter[disabled] {
  opacity: 0.35;
  cursor: not-allowed;
}

input[type="search"] {
  padding: 6px 10px;
  /* border: 1px solid #ccc; */
  border-radius: 0px;
}

.meta {
  font-size: 12px;
  color: #666;
}

.hidden {
  display: none;
}

/* =========================
   Sticky wrapper (your top bar)
========================= */
.filter-panels {
  position: sticky;
  top: 0;
  z-index: 10;
  background: white;
  padding: 8px 0;
}

/* Sticky container layout */
.compact-sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: white;
  padding: 6px;
  border-bottom: 3px solid #000;

  display: grid;
  grid-template-rows: auto auto;
  gap: 6px;
}

/* Row 1: controls */
.compact-sticky .controls {
  display: grid;
  grid-template-columns: auto minmax(140px, 1fr) auto auto;
  gap: 6px;
  align-items: center;
}

.compact-sticky .controls .filter,
.compact-sticky .controls input[type="search"] {
  padding: 4px 8px;
  font-size: 12px;
  line-height: 1.1;
}

.compact-sticky .controls input[type="search"] {
  min-width: 0; /* allow it to shrink */
}

/* Row 2: filters */
.compact-sticky .filters {
  display: grid;
  grid-template-columns: .6fr 1fr 0.3fr; /* Year narrower */
  gap: 6px;
  align-items: start;
}

/* Compact panels inside sticky */
.compact-sticky .panel {
  padding: 6px;
  min-width: 0;
}

.compact-sticky .panel h2 {
  font-size: 16px;
  margin: 0 0 4px;
  color: #444;
  line-height: 1.1;
}

.compact-sticky .btns {
  gap: 8px;
}

.compact-sticky .panel .filter {
  font-family:"BentonStrong"
  padding: 6px 6px;
  font-size: 12px;
  line-height: 1.25;
  border-radius: 0px;
}

.compact-sticky .panel.year .filter {
  padding: 3px 5px;
}

/* =========================
   SUBJECT COLOR SYSTEM
   - Buttons (Topic panel)
   - Table rows + Topic cell
========================= *//* Topic buttons: default (colored background) */
button.filter.subject-colored {
  background: var(--subject-color, var(--subject-color-default));
  /* border: 1px solid var(--subject-color, var(--subject-color-default)); */
  color: #fff;
}

/* Selected state: strong black outline */
button.filter.subject-colored[aria-pressed="true"] {
  outline: 2px solid #000;
  outline-offset: 0px;
}

/* Disabled topic buttons */
button.filter.subject-colored[disabled] {
  opacity: 0.35;
  filter: grayscale(100%);
}



/* Table */
table {
  border-collapse: collapse;
  width: 100%;
  max-width: 800px;
  margin-top: 14px;
  margin-left: auto;
  margin-right: auto;
}

th,
td {
  border-bottom: 1px solid #000;
  padding: 8px;
  text-align: left;
  vertical-align: top;
  font-size: 13px;
}

th {
  background: #fff;
  position: sticky;
  top: 0;
  font-family: "BentonStrong";
}

/* Make the Topic cell itself colored + slightly stronger */
td.topic-cell {
  font-family: "BentonStrong";
  color: var(--subject-color, var(--subject-color-default));
}

/* =========================
   Responsive
========================= */
@media (max-width: 780px) {
  .compact-sticky .controls {
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
  }

  .compact-sticky #count { justify-self: end; }
  .compact-sticky #downloadAll { justify-self: end; }

  .compact-sticky .filters {
    grid-template-columns: 1fr;
  }
}
/* Sticky bar stays full width */
.compact-sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: white;
  border-bottom: none;
  padding: 6px 0;          /* vertical only */
}

/* Centered 800px content inside sticky */
.topbar-inner {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 12px;         /* side breathing room on small screens */
  display: grid;
  grid-template-rows: auto auto;
  gap: 6px;
    border-bottom: 3px solid #000;

}
.controls{
  margin-bottom:10px;
}
</style>
</head>

<body>
<div class="topbar filter-panels compact-sticky">
  <div class="topbar-inner">
    <h1>Poll Aggregator</h1>*real categories and filter counts, no Description
    

    <div class="filters">
      <div class="panel topic-panel">
        <h2>Section</h2>
        <div id="topicBtns" class="btns"></div>
      </div>

      <div class="panel">
        <h2>Theme</h2>
        <div id="subtopicBtns" class="btns"></div>
      </div>

      <div class="panel year">
        <h2>Year</h2>
        <div id="yearBtns" class="btns"></div>
      </div>
    </div>
    <div class="controls">
      <button id="clearAll" class="filter">Clear Filters</button>
      <!-- <input id="search" type="search" placeholder="Search…" /> -->
      <div id="count" class="meta"></div>
      <a id="downloadAll" class="filter" href="#" download="full_dataset.csv">Download CSV</a>
    </div>
  </div>

</div>


<table id="table" class="hidden">
  <thead>
    <tr>
      <th style="width:40px">Year</th>
      <th style="width:120px">Topic</th>
      <th style="width:80px">Subtopic</th>
      <th>Description</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
// =======================
// CONFIG
// =======================
const CSV_PATH = "./data.csv"; // resolves to /polls/data.csv from /polls/index.html

// keep 0-count buttons visible but disabled?
const DISABLE_ZERO_COUNT_BUTTONS = true;

// NEW: only keep these non-filter columns (case-insensitive match to CSV headers)
const KEEP_OTHER_COLUMNS = ["Description"
  // Examples:
  // "Links",
  // "Title",
  // "Text"
];

// =======================
// SUBJECT COLOR SYSTEM (EDIT THESE 3)
// =======================
const SUBJECT_COLORS = {
  "Public opinion on ethics reform": "#3995B2",
  "Public opinion on life tenure": "#007194",
  "Public opinion of the Supreme Court as an institution": "#00415B"
};
const DEFAULT_SUBJECT_COLOR = "#777";

function subjectColor(subject) {
  return SUBJECT_COLORS[subject] || DEFAULT_SUBJECT_COLOR;
}

// =======================
// State
// =======================
const state = {
  data: [],
  others: [],
  // All unique values from full dataset (persistent buttons)
  allYears: [],
  allTopics: [],
  allSubtopics: [],
  filters: {
    year: new Set(),
    topic: new Set(),
    subtopic: new Set(),
    search: ""
  }
};

const els = {
  clearAll: document.getElementById("clearAll"),
  search: document.getElementById("search"),
  count: document.getElementById("count"),
  yearBtns: document.getElementById("yearBtns"),
  topicBtns: document.getElementById("topicBtns"),
  subtopicBtns: document.getElementById("subtopicBtns"),
  table: document.getElementById("table"),
  tbody: document.getElementById("tbody"),
};

// =======================
// CSV parsing
// =======================
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function normalizeHeader(h) {
  return (h || "").trim().toLowerCase();
}

function loadFromCSVText(csvText) {
  const rows = parseCSV((csvText || "").trim());
  if (!rows.length) throw new Error("CSV is empty.");

  const headersRaw = rows[0].map(h => (h || "").trim());
  state.headersRaw = headersRaw;

  const headersNorm = headersRaw.map(normalizeHeader);

  const yi = headersNorm.indexOf("year");
  const ti = headersNorm.indexOf("topic");
  const si = headersNorm.indexOf("subtopic");

  if (yi < 0 || ti < 0 || si < 0) {
    throw new Error(`CSV must include headers: year, topic, subtopic. Found: ${headersRaw.join(", ")}`);
  }

  // Map normalized header -> original header + index
  const headerIndexByNorm = new Map();
  headersRaw.forEach((h, i) => {
    const k = normalizeHeader(h);
    if (!headerIndexByNorm.has(k)) headerIndexByNorm.set(k, { raw: h, idx: i });
  });

  // Resolve KEEP_OTHER_COLUMNS (case-insensitive) to real headers/indices that exist in the CSV
  const keepOtherResolved = KEEP_OTHER_COLUMNS
    .map(name => headerIndexByNorm.get(normalizeHeader(name)))
    .filter(Boolean);

  // Only these "other" columns will be retained
  const otherIdxs = keepOtherResolved.map(x => ({ h: x.raw, i: x.idx }));
  state.others = otherIdxs.map(x => x.h);

  const data = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every(v => !String(v || "").trim())) continue;

    const others = {};
    for (const o of otherIdxs) {
      others[o.h] = (row[o.i] ?? "").trim();
    }

    data.push({
      year: (row[yi] ?? "").trim(),
      topic: (row[ti] ?? "").trim(),
      subtopic: (row[si] ?? "").trim(),
      others
    });
  }

  state.data = data;

  // Persistent button values from FULL data
  state.allYears = uniqueSorted(state.data.map(d => d.year), true);
  state.allTopics = uniqueSorted(state.data.map(d => d.topic), false);
  state.allSubtopics = uniqueSorted(state.data.map(d => d.subtopic), false);

//  updateDownloadLink(); // still works, now exports only kept columns + filters
  clearAll();
}

// =======================
// Filtering
// =======================
function passesSearch(d, q) {
     return true;
//   if (!q) return true;
//   const hay = [
//     d.year, d.topic, d.subtopic,
//     ...Object.values(d.others || {})
//   ].join(" ").toLowerCase();
//   return hay.includes(q);
}

function filterData(filtersOverride = null) {
  const F = filtersOverride || state.filters;
  const { year, topic, subtopic, search } = F;

  return state.data.filter(d => {
    if (year.size && !year.has(d.year)) return false;
    if (topic.size && !topic.has(d.topic)) return false;
    if (subtopic.size && !subtopic.has(d.subtopic)) return false;
    if (!passesSearch(d, search)) return false;
    return true;
  });
}

// Counts for a dimension given the *other* filters
function countsForDimension(dimKey) {
  // Clone filters, but remove this dimension’s selection so counts reflect “what would be available”
  const F = {
    year: new Set(state.filters.year),
    topic: new Set(state.filters.topic),
    subtopic: new Set(state.filters.subtopic),
    search: state.filters.search
  };
  F[dimKey].clear();

  const base = filterData(F);
  const m = new Map();

  for (const d of base) {
    const v = d[dimKey] || "";
    m.set(v, (m.get(v) || 0) + 1);
  }
  return m; // Map(value -> count)
}

function uniqueSorted(values, numericDescIfPossible) {
  const arr = [...new Set(values.filter(v => String(v).trim()))];

  if (numericDescIfPossible) {
    const allNumeric = arr.length && arr.every(v => !Number.isNaN(Number(v)));
    if (allNumeric) return arr.sort((a, b) => Number(b) - Number(a));
  }
  return arr.sort((a, b) => String(a).localeCompare(String(b)));
}

// =======================
// UI rendering
// =======================
function makeButton(label, count, pressed, disabled, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "filter";
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.disabled = !!disabled;

  // Show counts, but keep label clean
  b.textContent = `${label} (${count})`;

  b.addEventListener("click", onClick);
  return b;
}

function renderButtons(container, allValues, dimKey, countsMap) {
  container.innerHTML = "";
  const selectedSet = state.filters[dimKey];

  for (const v of allValues) {
    const count = countsMap.get(v) || 0;
    const pressed = selectedSet.has(v);

    // If pressed, allow un-pressing even if count is 0 under other filters
    const disabled = DISABLE_ZERO_COUNT_BUTTONS ? (!pressed && count === 0) : false;

    const btn = makeButton(v, count, pressed, disabled, () => toggle(dimKey, v));

    // ✅ Subject color system: apply ONLY to Topic buttons
    if (dimKey === "topic") {
      const c = subjectColor(v);
      btn.classList.add("subject-colored");
      btn.style.setProperty("--subject-color", c);
      btn.setAttribute("data-subject", v);
    }

    container.appendChild(btn);
  }
}

function renderTable(rows) {
  els.tbody.innerHTML = "";

  for (const d of rows) {
    const tr = document.createElement("tr");

    // ✅ Subject color system: use Topic as the "subject"
    const c = subjectColor(d.topic);
    tr.style.setProperty("--subject-color", c);
    tr.setAttribute("data-subject", d.topic);

    // Year
    {
      const td = document.createElement("td");
      td.textContent = d.year;
      tr.appendChild(td);
    }

    // Topic (colored)
    {
      const td = document.createElement("td");
      td.textContent = d.topic;
      td.className = "topic-cell";
      // color is driven by CSS var --subject-color
      tr.appendChild(td);
    }

    // Subtopic
    {
      const td = document.createElement("td");
      td.textContent = d.subtopic;
      tr.appendChild(td);
    }

    const tdOther = document.createElement("td");
    tdOther.innerHTML = Object.entries(d.others)
      .map(([k,v]) => `${k}: ${v}`)
      .join(" | ");

    // ✅ FORCE ALL LINKS TO OPEN IN NEW TAB
    tdOther.querySelectorAll("a[href]").forEach(a => {
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener noreferrer");
    });

    tr.appendChild(tdOther);
    els.tbody.appendChild(tr);
  }
}

function update() {
  const filtered = filterData();

  // counts per dimension (given other filters)
  const yearCounts = countsForDimension("year");
  const topicCounts = countsForDimension("topic");
  const subCounts = countsForDimension("subtopic");

  // Persistent buttons: always render ALL values from full dataset
  renderButtons(els.yearBtns, state.allYears, "year", yearCounts);
  renderButtons(els.topicBtns, state.allTopics, "topic", topicCounts);
  renderButtons(els.subtopicBtns, state.allSubtopics, "subtopic", subCounts);

  renderTable(filtered);

  els.count.textContent = ` Showing ${filtered.length.toLocaleString()} of ${state.data.length.toLocaleString()} polls`;
  els.table.classList.toggle("hidden", state.data.length === 0);
}

function toggle(dim, val) {
  const set = state.filters[dim];
  if (set.has(val)) set.delete(val);
  else set.add(val);
  update();
}

function clearAll() {
  state.filters.year.clear();
  state.filters.topic.clear();
  state.filters.subtopic.clear();
  state.filters.search = "";

  if (els.search) els.search.value = "";  // ✅ guard

  update();
}

// =======================
// Load CSV on page load
// =======================
async function init() {
  try {
    const res = await fetch(CSV_PATH);
    if (!res.ok) throw new Error(res.statusText);
    loadFromCSVText(await res.text());
  } catch (err) {
    console.error(err);
  }
}

els.clearAll.addEventListener("click", clearAll);

// Search temporarily disabled
// els.search.oninput = () => {
//   state.filters.search = els.search.value.toLowerCase();
//   update();
// };

init();
</script>

</body>
</html>
