<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data filtering test</title>

<style>
/* =========================
   Base / Typography
========================= */
@font-face {
  font-family: "Benton";
  src: url("Benton Sans/Benton Sans Book.otf");
}
@font-face {
  font-family: "BentonStrong";
  src: url("Benton Sans/Benton Sans Bold.otf");
}

:root {
  /* Fallback used when a topic is not in SUBJECT_COLORS */
  --subject-color-default: #777;
}

body {
  font-family: "Benton", -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  margin: 16px;
}

h1 {
  font-size: 36px;
  /* margin: 10 0 12px; */
  font-family: "BentonStrong";
  letter-spacing:.5px;
  text-align:center;
    margin:5px;

}
h2{
  font-size: 18px;
  margin:5px;
}
a {
  color: #007194;
  text-decoration: none;
}

/* =========================
   Topbar / Panels
========================= */
.topbar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.panel {
  font-family: "BentonStrong";
  /* border: 1px solid #ddd; */
  border-radius: 0px;
  padding: 12px;
}

.panel h2 {
  font-size: 14px;
  margin: 0 0 8px;
  color: #444;
}

.btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* =========================
   Controls
========================= */
button.filter {
  border: 1px solid #000;
  background: #fff;
  padding: 6px 12px;
  border-radius: 0px;
  cursor: pointer;
  text-align: left;
  max-width: 200px;
    display: flex;              /* override default button layout */

}

button.filter[aria-pressed="true"] {
  border-color: #000;
  background: #000;
  color: #fff;
}

button.filter[disabled] {
  opacity: 0.35;
  cursor: not-allowed;
}

input[type="search"] {
  padding: 6px 10px;
  /* border: 1px solid #ccc; */
  border-radius: 0px;
}

.meta {
  font-size: 12px;
  color: #666;
}

.hidden {
  display: none;
}
#clearAll{
  /* font-size:16px; */
  margin:10px
}

/* =========================
   Sticky wrapper (your top bar)
========================= */
.filter-panels {
  position: sticky;
  top: 0;
  z-index: 10;
  background: white;
  /* padding: 8px 0; */
}

/* Sticky container layout */
.compact-sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: white;
  padding: 6px;
  border-bottom: 3px solid #000;

  display: grid;
  grid-template-rows: auto auto;
  gap: 0px;
}

/* Row 1: controls */
.compact-sticky .controls {
  display: grid;
  grid-template-columns: auto minmax(140px, 1fr) auto auto;
  gap: 6px;
  align-items: center;
}

.compact-sticky .controls .filter,
.compact-sticky .controls input[type="search"] {
  padding: 4px 8px;
  font-size: 12px;
  line-height: 1.1;
}

.compact-sticky .controls input[type="search"] {
  min-width: 0; /* allow it to shrink */
}

/* Row 2: filters */
.compact-sticky .filters {
  display: grid;
  grid-template-columns: .6fr 1fr 0.3fr; /* Year narrower */
  gap: 6px;
  align-items: start;
}

/* Compact panels inside sticky */
.compact-sticky .panel {
  padding: 6px;
  min-width: 0;
}

.compact-sticky .panel h2 {
  font-size: 16px;
  margin: 0 0 4px;
  color: #444;
  line-height: 1.1;
}

.compact-sticky .btns {
  gap: 8px;
}

.compact-sticky .panel .filter {
  font-family: "BentonStrong";
  padding: 6px 6px;
  font-size: 12px;
  line-height: 1.25;
  border-radius: 0px;
}

.compact-sticky .panel.year .filter {
  padding: 3px 5px;
}

/* =========================
   SUBJECT COLOR SYSTEM
   - Buttons (Topic panel)
   - Table rows + Topic cell
========================= */
/* Topic buttons: default (colored background) */
button.filter.subject-colored {
  background: var(--subject-color, var(--subject-color-default));
  /* border: 1px solid var(--subject-color, var(--subject-color-default)); */
  color: #fff;
}

/* Selected state: strong black outline */
button.filter.subject-colored[aria-pressed="true"] {
  outline: 2px solid #000;
  outline-offset: 0px;
}

/* Disabled topic buttons */
button.filter.subject-colored[disabled] {
  opacity: 0.35;
  filter: grayscale(100%);
}

/* =========================
   Table
========================= */
thead th{
  /* position: sticky;
  top: var(--thead-offset, 0px); JS will set this */
  z-index: 30;                   /* above rows; below topbar if you want */
  background: #fff;
  /* top: var(--table-header-offset, 0px);
  line-height:1; */
}
table {
  border-collapse: separate;
  border-spacing:0;
  width: 100%;
  max-width: 800px;
  margin-top: 14px;
  margin-left: auto;
  margin-right: auto;
}

th, td {
  border-bottom: 1px solid #000;
  padding: 8px;
  text-align: left;
  vertical-align: top;
  font-size: 13px;
}

th {
  background: #fff;
  z-index: 5;              /* ← ADD THIS */
  font-family: "BentonStrong";
}

/* Make the Topic cell itself colored + slightly stronger */
td.topic-cell {
  font-family: "BentonStrong";
  color: var(--subject-color, var(--subject-color-default));
}

/* =========================
   Inline stacked bar chart
========================= */
.chart {
  display: grid;
  gap: 6px;
}

.chart-title {
  font-family: "BentonStrong";
  font-size: 14px;
  line-height: 1.2;
}

.chart-bars {
  display: flex;
  width: 100%;
  height: 10px;              /* thinner bar */
  border-radius: 0px;
  overflow: hidden;
  background: #fff;
}

.chart-seg {
  height: 100%;
}

.chart-seg.a1 {
  /* background:#3995B2; */
   background: var(--subject-color, var(--subject-color-default)); 
}

.chart-seg.a2 {
  background: #FFCF01;
}

/* legend on one line */
.chart-legend {
  display: flex;
  gap: 10px;
  font-size: 12px;
  line-height: 1.25;
  color: #111;
  flex-wrap: wrap; /* wraps on narrow screens */
}

.legend-item {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  white-space: nowrap;
}

.legend-swatch {
  width: 10px;
  height: 10px;
  /* border: 1px solid #000; */
  border-radius: 0px;
  flex: 0 0 auto;
}

.legend-swatch.a1 { background: var(--subject-color, var(--subject-color-default)); }
.legend-swatch.a2 { background: #FFCF01;}

.legend-text { display: inline; }
.legend-value { color: #444; }

/* Optional polish for link column */
td a {
  font-family: "BentonStrong";
  font-size: 12px;
  text-decoration: underline;
}

/* =========================
   Responsive
========================= */
@media (max-width: 780px) {
  .compact-sticky .controls {
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
  }

  .compact-sticky #count { justify-self: end; }
  .compact-sticky #downloadAll { justify-self: end; }

  .compact-sticky .filters {
    grid-template-columns: 1fr;
  }
}

/* Sticky bar stays full width */
.compact-sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: white;
  border-bottom: none;
  padding: 0px 0;         /* vertical only */
}

/* Centered 800px content inside sticky */
.topbar-inner {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 0px;        /* side breathing room on small screens */
  display: grid;
  grid-template-rows: auto auto;
  gap: 6px;

  border-bottom: 3px solid #000;
}

.controls{
  margin-bottom: 0 !important;
  padding:0px;
}
</style>
</head>

<body>
  This is a test, styles in progress.
  <br>Categories and filter counts are real, no real text or values<br>
<div id="filterBar" class="topbar filter-panels compact-sticky">
  <div class="topbar-inner">
    <h1>SCOTUS Polls</h1>

    <div class="filters">
      
      <div class="panel topic-panel">
        <h2>Section</h2>
        <div id="topicBtns" class="btns"></div>
      </div>

      <div class="panel">
        <h2>Theme</h2>
        <div id="subtopicBtns" class="btns"></div>
      </div>

      <div class="panel year">
        <h2>Year</h2>
        <div id="yearBtns" class="btns"></div>
      </div>
    </div>

    <div class="controls">
      <button id="clearAll" class="filter">Reset All Filters</button>
      <!-- <input id="search" type="search" placeholder="Search…" /> -->
      <div id="count" class="meta"></div> 
      <a id="downloadAll" class="filter" href="#" download="full_dataset.csv">
        Download Complete Dataset</a>
    </div>
  </div>
</div>

<table id="table" class="hidden">
  <thead>
    <tr>
      <th style="width:40px">Year</th>
      <th style="width:120px">Topic</th>
      <th style="width:120px">Subtopic</th>
      <th style="width:260px">Results</th> <!-- smaller bar column -->
      <th style="width:70px">Source</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
// =======================
// CONFIG
// =======================
const CSV_PATH = "data_values_source.csv"; // resolves to /polls/data.csv from /polls/index.html

// keep 0-count buttons visible but disabled?
const DISABLE_ZERO_COUNT_BUTTONS = true;

// If you later want to show additional fields after the chart, put their header names here.
// (Case-insensitive match to CSV headers.)
const KEEP_OTHER_COLUMNS = [
  // "Description",
  // "method"
];

// =======================
// SUBJECT COLOR SYSTEM (EDIT THESE 3)
// =======================
const SUBJECT_COLORS = {
  "Public opinion on ethics reform": "#3995B2",
  "Public opinion on life tenure": "#007194",
  "Public opinion of the Supreme Court as an institution": "#00415B"
};
const DEFAULT_SUBJECT_COLOR = "#777";

function subjectColor(subject) {
  return SUBJECT_COLORS[subject] || DEFAULT_SUBJECT_COLOR;
}

// =======================
// State
// =======================
const state = {
  data: [],
  others: [],

  // All unique values from full dataset (persistent buttons)
  allYears: [],
  allTopics: [],
  allSubtopics: [],

  filters: {
    year: new Set(),
    topic: new Set(),
    subtopic: new Set(),
    search: ""
  }
};

const els = {
  clearAll: document.getElementById("clearAll"),
  search: document.getElementById("search"),
  count: document.getElementById("count"),
  yearBtns: document.getElementById("yearBtns"),
  topicBtns: document.getElementById("topicBtns"),
  subtopicBtns: document.getElementById("subtopicBtns"),
  table: document.getElementById("table"),
  tbody: document.getElementById("tbody"),
};

// =======================
// CSV parsing
// =======================
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function normalizeHeader(h) {
  return (h || "").trim().toLowerCase();
}

function parseNumberLoose(x) {
  // Accept: "52", "52.1", "52%", "1,234", "", null
  const s = String(x ?? "").trim();
  if (!s) return NaN;
  const cleaned = s.replace(/[%,$]/g, "").replace(/,/g, "").trim();
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : NaN;
}

function loadFromCSVText(csvText) {
  const rows = parseCSV((csvText || "").trim());
  if (!rows.length) throw new Error("CSV is empty.");

  const headersRaw = rows[0].map(h => (h || "").trim());
  state.headersRaw = headersRaw;

  const headersNorm = headersRaw.map(normalizeHeader);

  const yi  = headersNorm.indexOf("year");
  const ti  = headersNorm.indexOf("topic");
  const si  = headersNorm.indexOf("subtopic");

  const qi  = headersNorm.indexOf("question wording");
  const a1t = headersNorm.indexOf("answer 1 text");
  const a1v = headersNorm.indexOf("answer 1 value");
  const a2t = headersNorm.indexOf("answer 2 text");
  const a2v = headersNorm.indexOf("answer 2 value");

  // NEW: link columns (display + URL)
  const ltxt = headersNorm.indexOf("link text");
  const lurl = headersNorm.indexOf("link url");

  if (yi < 0 || ti < 0 || si < 0) {
    throw new Error(`CSV must include headers: year, topic, subtopic. Found: ${headersRaw.join(", ")}`);
  }
  if (qi < 0 || a1t < 0 || a1v < 0 || a2t < 0 || a2v < 0) {
    throw new Error(
      `CSV must include chart headers: "question wording", "answer 1 text", "answer 1 value", "answer 2 text", "answer 2 value".
Found: ${headersRaw.join(", ")}`
    );
  }

  // Map normalized header -> original header + index
  const headerIndexByNorm = new Map();
  headersRaw.forEach((h, i) => {
    const k = normalizeHeader(h);
    if (!headerIndexByNorm.has(k)) headerIndexByNorm.set(k, { raw: h, idx: i });
  });

  // Resolve KEEP_OTHER_COLUMNS (case-insensitive) to real headers/indices that exist in the CSV
  const keepOtherResolved = KEEP_OTHER_COLUMNS
    .map(name => headerIndexByNorm.get(normalizeHeader(name)))
    .filter(Boolean);

  // Only these "other" columns will be retained
  const otherIdxs = keepOtherResolved.map(x => ({ h: x.raw, i: x.idx }));
  state.others = otherIdxs.map(x => x.h);

  const data = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every(v => !String(v || "").trim())) continue;

    const others = {};
    for (const o of otherIdxs) {
      others[o.h] = (row[o.i] ?? "").trim();
    }

    data.push({
      year: (row[yi] ?? "").trim(),
      topic: (row[ti] ?? "").trim(),
      subtopic: (row[si] ?? "").trim(),

      // Chart fields
      questionWording: (row[qi] ?? "").trim(),
      ans1Text: (row[a1t] ?? "").trim(),
      ans1ValueRaw: (row[a1v] ?? "").trim(),
      ans2Text: (row[a2t] ?? "").trim(),
      ans2ValueRaw: (row[a2v] ?? "").trim(),

      // Link fields (safe if missing)
      linkText: ltxt >= 0 ? (row[ltxt] ?? "").trim() : "",
      linkURL:  lurl >= 0 ? (row[lurl] ?? "").trim() : "",

      others
    });
  }

  state.data = data;

  // Persistent button values from FULL data
  state.allYears = uniqueSorted(state.data.map(d => d.year), true);
  state.allTopics = uniqueSorted(state.data.map(d => d.topic), false);
  state.allSubtopics = uniqueSorted(state.data.map(d => d.subtopic), false);

  //  updateDownloadLink(); // still works, now exports only kept columns + filters
  clearAll();
}

// =======================
// Filtering
// =======================
function passesSearch(d, q) {
  return true;
  // if (!q) return true;
  // const hay = [
  //   d.year, d.topic, d.subtopic,
  //   d.questionWording, d.ans1Text, d.ans1ValueRaw, d.ans2Text, d.ans2ValueRaw,
  //   d.linkText, d.linkURL,
  //   ...Object.values(d.others || {})
  // ].join(" ").toLowerCase();
  // return hay.includes(q);
}

function filterData(filtersOverride = null) {
  const F = filtersOverride || state.filters;
  const { year, topic, subtopic, search } = F;

  return state.data.filter(d => {
    if (year.size && !year.has(d.year)) return false;
    if (topic.size && !topic.has(d.topic)) return false;
    if (subtopic.size && !subtopic.has(d.subtopic)) return false;
    if (!passesSearch(d, search)) return false;
    return true;
  });
}

// Counts for a dimension given the *other* filters
function countsForDimension(dimKey) {
  // Clone filters, but remove this dimension’s selection so counts reflect “what would be available”
  const F = {
    year: new Set(state.filters.year),
    topic: new Set(state.filters.topic),
    subtopic: new Set(state.filters.subtopic),
    search: state.filters.search
  };
  F[dimKey].clear();

  const base = filterData(F);
  const m = new Map();

  for (const d of base) {
    const v = d[dimKey] || "";
    m.set(v, (m.get(v) || 0) + 1);
  }
  return m; // Map(value -> count)
}

function uniqueSorted(values, numericDescIfPossible) {
  const arr = [...new Set(values.filter(v => String(v).trim()))];

  if (numericDescIfPossible) {
    const allNumeric = arr.length && arr.every(v => !Number.isNaN(Number(v)));
    if (allNumeric) return arr.sort((a, b) => Number(b) - Number(a));
  }
  return arr.sort((a, b) => String(a).localeCompare(String(b)));
}

// =======================
// UI rendering
// =======================


function updateTableHeaderOffset() {
  const bar = document.getElementById("filterBar");
  if (!bar) return;

  const rect = bar.getBoundingClientRect();
  const height = Math.ceil(rect.height);

  document.documentElement.style
    .setProperty("--table-header-offset", `${height}px`);
}

function makeButton(label, count, pressed, disabled, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "filter";
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.disabled = !!disabled;

  // Show counts, but keep label clean
  b.textContent = `${label} (${count})`;

  b.addEventListener("click", onClick);
  return b;
}

function renderButtons(container, allValues, dimKey, countsMap) {
  container.innerHTML = "";
  const selectedSet = state.filters[dimKey];

  for (const v of allValues) {
    const count = countsMap.get(v) || 0;
    const pressed = selectedSet.has(v);

    // If pressed, allow un-pressing even if count is 0 under other filters
    const disabled = DISABLE_ZERO_COUNT_BUTTONS ? (!pressed && count === 0) : false;

    const btn = makeButton(v, count, pressed, disabled, () => toggle(dimKey, v));

    // ✅ Subject color system: apply ONLY to Topic buttons
    if (dimKey === "topic") {
      const c = subjectColor(v);
      btn.classList.add("subject-colored");
      btn.style.setProperty("--subject-color", c);
      btn.setAttribute("data-subject", v);
    }

    container.appendChild(btn);
  }
}

function escapeHTML(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function makeStackedChartCell(d) {
  const a1 = parseNumberLoose(d.ans1ValueRaw);
  const a2 = parseNumberLoose(d.ans2ValueRaw);

  const total = (Number.isFinite(a1) ? a1 : 0) + (Number.isFinite(a2) ? a2 : 0);
  const pct1 = total > 0 && Number.isFinite(a1) ? (a1 / total) * 100 : 0;
  const pct2 = total > 0 && Number.isFinite(a2) ? (a2 / total) * 100 : 0;

  const wrap = document.createElement("div");
  wrap.className = "chart";

  const title = document.createElement("div");
  title.className = "chart-title";
  title.textContent = d.questionWording || "";
  wrap.appendChild(title);

  const bars = document.createElement("div");
  bars.className = "chart-bars";

  const seg1 = document.createElement("div");
  seg1.className = "chart-seg a1";
  seg1.style.width = `${Math.max(0, Math.min(100, pct1))}%`;
  seg1.title = `${d.ans1Text || "Answer 1"}: ${d.ans1ValueRaw || ""}`;
  bars.appendChild(seg1);

  const seg2 = document.createElement("div");
  seg2.className = "chart-seg a2";
  seg2.style.width = `${Math.max(0, Math.min(100, pct2))}%`;
  seg2.title = `${d.ans2Text || "Answer 2"}: ${d.ans2ValueRaw || ""}`;
  bars.appendChild(seg2);

  wrap.appendChild(bars);

  const legend = document.createElement("div");
  legend.className = "chart-legend";

  const item1 = document.createElement("div");
  item1.className = "legend-item";
  item1.innerHTML = `
    <span class="legend-swatch a1"></span>
    <span class="legend-text">${escapeHTML(d.ans1Text || "Answer 1")}</span>
    <span class="legend-value">(${escapeHTML(d.ans1ValueRaw || "")})</span>
  `;

  const item2 = document.createElement("div");
  item2.className = "legend-item";
  item2.innerHTML = `
    <span class="legend-swatch a2"></span>
    <span class="legend-text">${escapeHTML(d.ans2Text || "Answer 2")}</span>
    <span class="legend-value">(${escapeHTML(d.ans2ValueRaw || "")})</span>
  `;

  legend.appendChild(item1);
  legend.appendChild(item2);
  wrap.appendChild(legend);

  return wrap;
}

function isSafeURL(url) {
  // Avoid javascript: and other weird schemes.
  // Allow http(s) and relative URLs.
  const u = String(url || "").trim();
  if (!u) return false;
  if (u.startsWith("/")) return true;
  if (u.startsWith("./") || u.startsWith("../")) return true;
  try {
    const parsed = new URL(u, window.location.href);
    return parsed.protocol === "http:" || parsed.protocol === "https:";
  } catch {
    return false;
  }
}

function renderTable(rows) {
  els.tbody.innerHTML = "";

  for (const d of rows) {
    const tr = document.createElement("tr");

    // ✅ Subject color system: use Topic as the "subject"
    const c = subjectColor(d.topic);
    tr.style.setProperty("--subject-color", c);
    tr.setAttribute("data-subject", d.topic);

    // Year
    {
      const td = document.createElement("td");
      td.textContent = d.year;
      tr.appendChild(td);
    }

    // Topic (colored)
    {
      const td = document.createElement("td");
      td.textContent = d.topic;
      td.className = "topic-cell";
      tr.appendChild(td);
    }

    // Subtopic
    {
      const td = document.createElement("td");
      td.textContent = d.subtopic;
      tr.appendChild(td);
    }

    // Results (stacked bar chart)
    {
      const td = document.createElement("td");
      td.appendChild(makeStackedChartCell(d));
      tr.appendChild(td);
    }

    // Link
    {
      const td = document.createElement("td");

      if (d.linkURL && isSafeURL(d.linkURL)) {
        const a = document.createElement("a");
        a.href = d.linkURL;
        a.textContent = d.linkText || "Link";
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        td.appendChild(a);
      } else {
        td.textContent = "";
      }

      tr.appendChild(td);
    }

    els.tbody.appendChild(tr);
  }
}

function update() {
  const filtered = filterData();

  // counts per dimension (given other filters)
  const yearCounts = countsForDimension("year");
  const topicCounts = countsForDimension("topic");
  const subCounts = countsForDimension("subtopic");

  // Persistent buttons: always render ALL values from full dataset
  renderButtons(els.yearBtns, state.allYears, "year", yearCounts);
  renderButtons(els.topicBtns, state.allTopics, "topic", topicCounts);
  renderButtons(els.subtopicBtns, state.allSubtopics, "subtopic", subCounts);

  renderTable(filtered);

  els.count.textContent = ` Showing ${filtered.length.toLocaleString()} of ${state.data.length.toLocaleString()} polls`;
  els.table.classList.toggle("hidden", state.data.length === 0);
}

function toggle(dim, val) {
  const set = state.filters[dim];
  if (set.has(val)) set.delete(val);
  else set.add(val);
  update();
}

function clearAll() {
  state.filters.year.clear();
  state.filters.topic.clear();
  state.filters.subtopic.clear();
  state.filters.search = "";

  if (els.search) els.search.value = "";  // ✅ guard
  update();
}


window.addEventListener("resize", updateTableHeaderOffset);

// Font loading can change heights
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(updateTableHeaderOffset);
}

// =======================
// Load CSV on page load
// =======================
async function init() {
  try {
        updateTableHeaderOffset();  

    const res = await fetch(CSV_PATH);
    if (!res.ok) throw new Error(res.statusText);
    loadFromCSVText(await res.text());
  } catch (err) {
    console.error(err);
  }
}

els.clearAll.addEventListener("click", clearAll);

// Search temporarily disabled
// els.search.oninput = () => {
//   state.filters.search = els.search.value.toLowerCase();
//   update();
// };

init();
</script>
